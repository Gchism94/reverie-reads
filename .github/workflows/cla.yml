name: 'CLA Assistant'

# Independent of ci.yml's docs_only path classifier by design — this is a PR-comment bot, not a
# test, and gates on a comment/CLA-document trigger rather than changed files. pull_request_target
# (not pull_request) so the action always runs with the base repo's token, even for fork PRs — safe
# here because the action never checks out or executes the PR's head commit; it only calls the
# GitHub API (comment, status, and a commit to the signatures branch below).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: cla
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'
    steps:
      - name: 'CLA Assistant'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/Gchism94/reverie-reads/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          # main is protected by a repository ruleset requiring PRs (docs/archive/task-ci.md /
          # .github/workflows/ci.yml) — a direct push from this action's default GITHUB_TOKEN would
          # be refused there. This branch is unprotected, dedicated to the signature file, and the
          # action creates it on first sign if it doesn't already exist.
          branch: 'cla-signatures'
          # No bot allowlist — this repo has no Dependabot or similar automation opening PRs today.
          # Add entries here (comma-separated, wildcards allowed, e.g. 'bot*') if that changes.
          lock-pullrequest-aftermerge: true

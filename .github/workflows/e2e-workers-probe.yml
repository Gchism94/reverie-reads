# TEMPORARY measurement workflow for chore/ci-throughput — DELETED before merge.
#
# Purpose: measure E2E_WORKERS=2 and =4 ON THE RUNNER, post trio-migration — the standing
# playwright.config.ts numbers are pre-trio and local-only, and the config's own comment says the
# default stays 1 "until a dedicated stage does that measurement". This is that stage.
#
# Shape: each job is a FULL suite run (`pnpm e2e`, no --project) — all three projects share one
# worker pool in one process on one runner, which is the contention-maximal shape. A pass rate
# measured here is conservative evidence for CI's real per-project jobs, which are strictly
# lighter. Fresh DB per job by construction (runner Docker volumes are never cached); retries 0
# per the config. Three iterations per worker count; jobs are isolated (own runner, own stack,
# own DB) so parallel iterations are independent samples.
#
# `paths` self-filter: only pushes that touch THIS file retrigger the probe — the branch's later
# commits (the actual CI changes) must not burn 6 runner-hours re-measuring.
name: e2e-workers-probe

on:
  push:
    branches: ['chore/ci-throughput']
    paths: ['.github/workflows/e2e-workers-probe.yml']

jobs:
  probe:
    name: probe (workers=${{ matrix.workers }} run ${{ matrix.iteration }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 4]
        iteration: [1, 2, 3]
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:55321
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      E2E_WORKERS: ${{ matrix.workers }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get installed Playwright version
        id: playwright-version
        run: |
          version="$(pnpm --filter @reverie/web exec playwright --version | sed 's/^Version //')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @reverie/web exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit — browsers already present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @reverie/web exec playwright install-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Start Supabase
        run: supabase start -x studio,vector,edge-runtime,imgproxy

      - name: Full suite (all three projects, workers=${{ matrix.workers }})
        run: pnpm --filter @reverie/web e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probe-traces-w${{ matrix.workers }}-r${{ matrix.iteration }}
          path: apps/web/test-results/
          retention-days: 7

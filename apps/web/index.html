<!doctype html>
<html lang="en" data-skin="tryst" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the tab bar pad itself past the home indicator (safe-area inset) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Installable/PWA basics. The icon is the Wordmark's gold crescent on the brand night. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0612" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Reverie — Your reading life, kept in full</title>
    <meta
      name="description"
      content="Keep books, rereads, series, plans, and a distinct household library together in a reading room that feels like yours."
    />
    <link rel="canonical" href="https://reveriereads.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reverie" />
    <meta property="og:title" content="Reverie — Your reading life, kept in full" />
    <meta
      property="og:description"
      content="A personal library for books, rereads, series, plans, and shared household shelves that keep every reader distinct."
    />
    <meta property="og:url" content="https://reveriereads.app/" />
    <meta property="og:image" content="https://reveriereads.app/reverie-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Reverie — keep the whole story of your reading life" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reverie — Your reading life, kept in full" />
    <meta
      name="twitter:description"
      content="A personal library for books, rereads, series, plans, and shared household shelves that keep every reader distinct."
    />
    <meta name="twitter:image" content="https://reveriereads.app/reverie-share.png" />
    <!-- Only the ACTIVE skin's font pairing is loaded (below, pre-paint), not all nine families.
         Fonts are SELF-HOSTED under /fonts (scripts/fetch-fonts.mjs) — no third-party host.
         The Skin Gallery loads the rest on demand. Keep this map in sync with src/skin/fonts.ts. -->
    <script>
      // Set skin + light/dark mode before first paint to avoid a flash of the wrong identity.
      ;(function () {
        try {
          var valid = { tryst: 1, grimoire: 1, aphelion: 1, marrow: 1, umbra: 1, folio: 1, hearth: 1, almanac: 1, bloom: 1 }
          var skin = localStorage.getItem('reverie.skin')
          if (!valid[skin]) skin = 'tryst'
          // Load ONLY the active skin's font pairing, pre-paint (each @font-face carries font-display: swap → no FOIT).
          var FONT = {
            tryst: '/fonts/tryst.css',
            grimoire: '/fonts/grimoire.css',
            aphelion: '/fonts/aphelion.css',
            marrow: '/fonts/marrow.css',
            umbra: '/fonts/umbra.css',
            folio: '/fonts/folio.css',
            hearth: '/fonts/hearth.css',
            almanac: '/fonts/almanac.css',
            bloom: '/fonts/bloom.css',
          }
          var fl = document.createElement('link')
          fl.rel = 'stylesheet'
          fl.href = FONT[skin]
          fl.setAttribute('data-skin-font', '')
          document.head.appendChild(fl)
          var mode = localStorage.getItem('reverie.mode')
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system'
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : mode
          document.documentElement.dataset.skin = skin
          document.documentElement.dataset.mode = resolved
        } catch (e) {
          document.documentElement.dataset.skin = 'tryst'
          document.documentElement.dataset.mode = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
